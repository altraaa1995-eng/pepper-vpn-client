name: Agent AI Checks

on:
  pull_request:
    paths:
      - "agent-ai/**"
      - ".github/workflows/agent-ai.yml"
  push:
    branches:
      - master
    paths:
      - "agent-ai/**"
      - ".github/workflows/agent-ai.yml"

jobs:
  agent_ai_tests:
    name: Agent AI smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          node --check index.js
          node --check src/agent.js
          node --check src/tools.js
          node --check src/mistral.js
          node --check src/termux.js

      - name: Smoke tests
        run: node tests/smoke.test.mjs
